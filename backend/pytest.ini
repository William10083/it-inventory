[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q
    --ignore=tests/test_actas_diana.py
    --ignore=tests/test_dynamic_placeholder_mapping.py
    --ignore=tests/test_full_flow.py
    --ignore=tests/test_template_path_resolution.py
    --ignore=tests/test_template_fix.py
    --ignore=tests/test_business_logic.py
    --ignore=tests/test_final_format.py
    --ignore=tests/test_decommission_endpoint.py
    --ignore=tests/test_new_decommission_fields.py
    --ignore=tests/test_image_insertion.py
    --ignore=tests/test_decommission_debug.py
