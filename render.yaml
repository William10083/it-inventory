services:
  # ─── Backend (FastAPI) ────────────────────────────────────────────────────
  - type: web
    name: it-inventory-backend
    runtime: python
    branch: main
    repo: https://github.com/William10083/it-inventory
    rootDir: backend
    buildCommand: >
      pip install torch --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false           # Definir manualmente en Render dashboard
      - key: SECRET_KEY
        generateValue: true   # Render genera una clave aleatoria segura automáticamente
      - key: ALLOWED_ORIGINS
        sync: false           # Definir con la URL del frontend después del deploy

  # ─── Frontend (React/Vite → Static Site) ─────────────────────────────────
  - type: web
    name: it-inventory-frontend
    runtime: static
    branch: main
    repo: https://github.com/William10083/it-inventory
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false           # Definir con la URL del backend después del deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
